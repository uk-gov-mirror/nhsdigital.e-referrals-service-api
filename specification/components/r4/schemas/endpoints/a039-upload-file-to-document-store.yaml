security:
  -
    bearerAuth:

description: |
  ## Overview
  
  Use this endpoint to initiate the upload of a file containing clinical information to e-RS ready to be associated with a referral, an advice and guidance request or an advice and guidance response.
  
   This end point supersedes A020 and should be used for any new work. 
  
  ## Supported security patterns
  - Healthcare worker, user-restricted access
  
  ## Pre-requisites
  In order to use this endpoint you must be an authenticated e-RS user and use one of the following e-RS roles:
    - `REFERRING_CLINICIAN`
    - `REFERRING_CLINICIAN_ADMIN`
    - `SERVICE_PROVIDER_CLINICIAN`
    - `SERVICE_PROVIDER_CLINICIAN_ADMIN`
  
  You can only upload file formats that are supported by e-RS. Currently, the supported file formats are:
  
  | File type          | File extension(s)           | MIME Type                                                                    |
  | ------------------ | --------------------------- | ---------------------------------------------------------------------------- |
  | Plain Text         | `.txt`                      | `text/plain`                                                                 |
  | PDF                | `.pdf`                      | `application/pdf`                                                            |
  | XML Text           | `.xml`                      | `text/xml`                                                                   |
  | RTF Text           | `.rtf`, `.rtx`              | `application/rtf`                                                            |
  | Basic Audio        | `.au`                       | `audio/basic`                                                                |
  | MPEG audio layer 3 | `.mp3`                      | `audio/mpeg`                                                                 |
  | PNG Image          | `.png`                      | `image/png`                                                                  |
  | GIF Image          | `.gif`                      | `image/gif`                                                                  |
  | JPEG Image         | `.jpg`, `.jpe`, `.jpeg`     | `image/jpeg`                                                                 |
  | TIFF Image         | `.tif`, `.tiff`             | `image/tiff`                                                                 |
  | MPEG Video         | `.mpg`, `.mpeg`, `.mpe`     | `video/mpeg`                                                                 |
  | MSWORD             | `.doc`, `.docx`             | `application/msword`, `application/vnd.openxmlformats-officedocument.wordprocessingml.document` |
  | DICOM              | `.dcm`                      | `application/dicom`                                                          |
  
  Currently, the maximum file size supported by e-RS is 5MB. This will be increasing to 100mb inline with the roadmap.
  
  ## Use case
  
  As an authenticated user
  
  I need to upload a referral letter or other clinical information file to e-RS
  
  So that I can associate the file with an existing referral or advice and guidance request.
  
  ## Important notes
  
  This endpoint **only** initiates the file upload and **does not** associate it with a referral. The uploaded file must be explicitly associated with a referral by, for example, using [Maintain referral letter (A012)](#post-/STU3/ReferralRequest/-ubrn-/$ers.maintainReferralLetter).
  
  The file will not immediately be available for download, it must pass a malware scan first. The file can be associated with referrals during this period, but will have an `AvailabilityStatus` of `Pending` until the scan is complete. 
  
  Request header `NHSD-eRS-Referral-ID` - the ID (typically the UBRN) of the referral which the documents are intended for - is non-mandatory, but must be provided if this file is to be attached to an existing request.
  
  ## Support for a temporary redirect
  
  This end point will respond with a 200 code as it returns a body. Note that it behaves like a temporary redirect. The response will contain a `Location` header, which is the URL where the file should be uploaded to and a `Binary` resource in the body, which will contain the Binary Id used to reference the file when using other end points.
  
  The temporary location is only valid for a short period of time and should be used immediately. 
  
  Callers of this endpoint must ensure they:
    - perform a PUT to this location to upload the file
    - do not cache the temporary location
    - do not attempt to re-use the temporary location
    - supply a file size header (when calling A039) that EXACTLY matches the size of the file uploaded
  
  See the Response HTTP 200 section for further information.
  
  ## Related endpoints
  
  You can associate the uploaded file with a specific referral using:
    - [Maintain referral letter (A012)](#post-/STU3/ReferralRequest/-ubrn-/$ers.maintainReferralLetter)
    - [Cancel appointment, action later (A022)](#post-/STU3/ReferralRequest/-ubrn-/$ers.cancelAppointmentActionLater)
    - [Record triage outcome (A028)](#post-/STU3/ReferralRequest/-ubrn-/$ers.recordReviewOutcome)
  
  You can associate the uploaded file with a specific advice and guidance request using:
    - [Create advice and guidance request (A044)](#post-/STU3/CommunicationRequest/$ers.createAdviceAndGuidance)
    - [Send advice and guidance response (A026)](#post-/STU3/CommunicationRequest/-ubrn-/$ers.sendCommunicationToRequester)
    - [Convert advice and guidance request to referral (A027)](#post-/STU3/ReferralRequest/$ers.createFromCommunicationRequestActionLater)
summary: 'Upload file to document store (A039, FHIR R4)'
operationId: 'a039-upload-file-to-document-store'
tags:
  - 'Refer patient'
  - 'Request advice'
  - 'Arrange appointment'
  - 'Arrange triage'
parameters:
  -
    in: 'header'
    name: 'Authorization'
    description: |
      An [OAuth 2.0 bearer token](https://digital.nhs.uk/developer/guides-and-documentation/security-and-authorisation#user-restricted-apis).
      
      Required in all environments except sandbox.
    required: true
    schema:
      type: 'string'
      format: '^Bearer\ [[:ascii:]]+$'
      example: 'Bearer g1112R_ccQ1Ebbb4gtHBP1aaaNM'
  -
    in: 'header'
    name: 'NHSD-End-User-Organisation-ODS'
    description: |
      The ODS code of the caller's Organisation
    required: true
    schema:
      type: 'string'
      example: 'R69'
  -
    in: 'header'
    name: 'NHSD-eRS-Business-Function'
    description: |
      The e-RS Business Function of the caller
    required: true
    schema:
      type: 'string'
      enum:
        - 'REFERRING_CLINICIAN'
        - 'REFERRING_CLINICIAN_ADMIN'
        - 'SERVICE_PROVIDER_CLINICIAN_ADMIN'
        - 'SERVICE_PROVIDER_CLINICIAN'
      example: 'SERVICE_PROVIDER_CLINICIAN_ADMIN'
  -
    in: 'header'
    name: 'NHSD-eRS-On-Behalf-Of-User-ID'
    description: |
      The (SDS) user ID of the user that the authenticating user wishes to act on behalf of (OBO). 
      
      "On behalf of" is only supported for a Service Provider Clinician Admin (SPCA) acting on behalf of a Service Provider Clinician (SPC). 
      
      Where an OBO User ID is supplied the authenticating user must be an SPCA and the OBO User ID must be that of an appropriate SPC.  
    required: false
    schema:
      type: 'string'
      example: '021600556514'
  -
    in: 'header'
    name: 'X-Correlation-ID'
    description: |
      Arbitrary string value provided by API Consumer
      
      Tends to be unique, but does not have to be
      
      Returned, unchanged, in the response
    required: false
    schema:
      type: 'string'
      example: '11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA'
  -
    in: 'header'
    name: 'NHSD-eRS-File-Name'
    description: |
      The name of file being uploaded, including the extension
    required: true
    schema:
      type: 'string'
      example: 'test.txt'
  -
    in: 'header'
    name: 'NHSD-eRS-File-Size'
    description: |
      The size of file being uploaded, in bytes
    required: true
    schema:
      type: 'integer'
      minimum: 1
      maximum: 5242880
      format: 'int32'
      example: 1024
  -
    in: 'header'
    name: 'NHSD-eRS-File-MIME-Type'
    description: |
      The mime type of file being uploaded, must be one from the list of supported types above
    required: true
    schema:
      type: 'string'
      example: 'text/plain'
  -
    in: 'header'
    name: 'NHSD-eRS-Referral-ID'
    description: |
      The ID (typically the UBRN) of the referral which the documents are intended for. This must be provided if this file is to be attached to an existing request.
    required: false
    schema:
      type: 'string'
      example: '000000070000'
responses:
  200:
    description: 'Response body is a `Binary` resource containing binary id for the file to be uploaded. The file should be uploaded via a PUT to the uri returned in the Location header.'
    headers:
      x-correlation-id:
        description: |
          The X-Correlation-ID from the request header, if supplied, mirrored back.
        required: false
        schema:
          type: 'string'
          example: '11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA'
      x-request-id:
        description: |
          The e-RS transaction id
        required: false
        schema:
          type: 'string'
          example: '58621d65-d5ad-4c3a-959f-0438e355990e-1'
      Location:
        description: 'Location in the object store where the file should be uploaded to'
        required: true
        schema:
          type: 'string'
          format: 'uri'
          example: 'https://s3.amazonaws.com/nhs-example-bucket/patientfile.txt?X-Amz-Algorithm=AWS4-HMAC...'
    content:
      'application/fhir+json':
        schema:
          title: 'Binary resource'
          description: 'A FHIR Binary resource containing document data.'
          type: 'object'
          required:
            - 'resourceType'
            - 'contentType'
          properties:
            resourceType:
              type: 'string'
              enum:
                - 'Binary'
              example: 'Binary'
            identifier:
              type: 'array'
              items:
                type: 'object'
                required:
                  - 'system'
                  - 'value'
                properties:
                  system:
                    type: 'string'
                    enum:
                      - 'https://fhir.nhs.uk/Id/ers-binary-id'
                    example: 'https://fhir.nhs.uk/Id/ers-binary-id'
                  value:
                    type: 'string'
                    example: 'c5d2d200-7613-4a69-9c5f-1bb68e04b8d8'
            contentType:
              type: 'string'
              example: 'application/pdf'
        examples:
          example-response-body:
            summary: 'Example response body'
            value:
              resourceType: 'Binary'
              identifier:
                -
                  system: 'https://fhir.nhs.uk/Id/ers-binary-id'
                  value: 'c5d2d200-7613-4a69-9c5f-1bb68e04b8d8'
              contentType: 'application/pdf'
  401:
    description: |
      Where status code 401 (Unauthorised) is returned then an eRS-OperationOutcome-1 will be included in the body, as detailed below.
      Check diagnostics property for specific information regarding the error.
      
      | issue.details.coding.code | issue.code | Coding System                                                      | Description                                                                        |
      | ------------------------- | ---------- | ------------------------------------------------------------------ | ---------------------------------------------------------------------------------- |
      | NO_ACCESS                 | <ul><li>login</li><li>forbidden</li></ul>  | [eRS Error Code](https://fhir.nhs.uk/CodeSystem/ers-error-codes)   | The request could not be authenticated due to either no credentials being provided or the provided credentials no longer being valid. Callers receiving this code should reauthenticate. |
    headers:
      X-Correlation-ID:
        description: |
          The X-Correlation-ID from the request header, if supplied, mirrored back.
        required: false
        schema:
          type: 'string'
          example: '11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA'
      X-Request-ID:
        description: |
          The e-RS transaction id
        required: false
        schema:
          type: 'string'
          example: '58621d65-d5ad-4c3a-959f-0438e355990e-1'
      Content-Type:
        description: |
          Indicates the media type of the associated resource.
        required: true
        schema:
          type: 'string'
          enum:
            - 'application/fhir+json'
          example: 'application/fhir+json'
    content:
      'application/fhir+json':
        schema:
          title: 'eRS-OperationOutcome'
          type: 'object'
          required:
            - 'resourceType'
            - 'meta'
            - 'issue'
          properties:
            resourceType:
              type: 'string'
              enum:
                - 'OperationOutcome'
              example: 'OperationOutcome'
            meta:
              type: 'object'
              properties:
                profile:
                  type: 'array'
                  items:
                    type: 'string'
                    enum:
                      - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                    example: 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                  minItems: 1
                  maxItems: 1
            issue:
              type: 'array'
              items:
                type: 'object'
                required:
                  - 'severity'
                  - 'code'
                  - 'details'
                properties:
                  severity:
                    type: 'string'
                    example: 'error'
                  code:
                    type: 'string'
                    example: 'business-rule'
                  diagnostics:
                    type: 'string'
                    example: '''Shortlist/Service Id'' (11002) cannot be added to a shortlist more than once.'
                  details:
                    type: 'object'
                    required:
                      - 'coding'
                    properties:
                      coding:
                        type: 'array'
                        items:
                          type: 'object'
                          required:
                            - 'system'
                            - 'code'
                            - 'display'
                          properties:
                            system:
                              type: 'string'
                              enum:
                                - 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                              example: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                            code:
                              type: 'string'
                              example: 'DUPLICATE_SERVICE'
                            display:
                              type: 'string'
                              example: 'Duplicate service found in shortlist'
        example:
          meta:
            profile:
              - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
          resourceType: 'OperationOutcome'
          issue:
            -
              severity: 'error'
              code: 'login'
              details:
                coding:
                  -
                    system: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                    code: 'NO_ACCESS'
              diagnostics: 'Example diagnostics message.'
  403:
    description: |
      Where status code 403 (Forbidden) is returned then an eRS-OperationOutcome-1 will be included in the body, as detailed below.
      Check diagnostics property for specific information regarding the error.
      
      | issue.details.coding.code | issue.code | Coding System                                                      | Description                                                                        |
      | ------------------------- | ---------- | ------------------------------------------------------------------ | ---------------------------------------------------------------------------------- |
      | FORBIDDEN                 | forbidden  | [eRS Error Code](https://fhir.nhs.uk/CodeSystem/ers-error-codes)   | A call attempts to access or operate upon a resource without proper authorisation. |
      | NO_ACCESS                 | forbidden  | [eRS Error Code](https://fhir.nhs.uk/CodeSystem/ers-error-codes)   | The request could not be authenticated due to insufficient credentials being provided. |
    headers:
      X-Correlation-ID:
        description: |
          The X-Correlation-ID from the request header, if supplied, mirrored back.
        required: false
        schema:
          type: 'string'
          example: '11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA'
      X-Request-ID:
        description: |
          The e-RS transaction id
        required: false
        schema:
          type: 'string'
          example: '58621d65-d5ad-4c3a-959f-0438e355990e-1'
      Content-Type:
        description: |
          Indicates the media type of the associated resource.
        required: true
        schema:
          type: 'string'
          enum:
            - 'application/fhir+json'
          example: 'application/fhir+json'
    content:
      'application/fhir+json':
        schema:
          title: 'eRS-OperationOutcome'
          type: 'object'
          required:
            - 'resourceType'
            - 'meta'
            - 'issue'
          properties:
            resourceType:
              type: 'string'
              enum:
                - 'OperationOutcome'
              example: 'OperationOutcome'
            meta:
              type: 'object'
              properties:
                profile:
                  type: 'array'
                  items:
                    type: 'string'
                    enum:
                      - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                    example: 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                  minItems: 1
                  maxItems: 1
            issue:
              type: 'array'
              items:
                type: 'object'
                required:
                  - 'severity'
                  - 'code'
                  - 'details'
                properties:
                  severity:
                    type: 'string'
                    example: 'error'
                  code:
                    type: 'string'
                    example: 'business-rule'
                  diagnostics:
                    type: 'string'
                    example: '''Shortlist/Service Id'' (11002) cannot be added to a shortlist more than once.'
                  details:
                    type: 'object'
                    required:
                      - 'coding'
                    properties:
                      coding:
                        type: 'array'
                        items:
                          type: 'object'
                          required:
                            - 'system'
                            - 'code'
                            - 'display'
                          properties:
                            system:
                              type: 'string'
                              enum:
                                - 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                              example: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                            code:
                              type: 'string'
                              example: 'DUPLICATE_SERVICE'
                            display:
                              type: 'string'
                              example: 'Duplicate service found in shortlist'
        example:
          meta:
            profile:
              - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
          resourceType: 'OperationOutcome'
          issue:
            -
              severity: 'error'
              code: 'forbidden'
              details:
                coding:
                  -
                    system: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                    code: 'FORBIDDEN'
                    display: 'Forbidden'
              diagnostics: 'Example diagnostics message.'
  406:
    description: 'Not Acceptable'
    headers:
      Content-Type:
        description: |
          Indicates the media type of the associated resource. 
        schema:
          type: 'string'
          enum:
            - 'text/plain;charset=utf-8'
          example: 'text/plain;charset=utf-8'
    content:
      'text/plain;charset=utf-8':
        schema:
          type: 'string'
  415:
    description: 'Unsupported Media Type'
    content:
      'text/plain;charset=utf-8':
        schema:
          type: 'string'
  422:
    description: |
      Where status code 422 (Unprocessable Entity) is returned then an eRS-OperationOutcome-1 will be included in the body, as detailed below. 
      Check diagnostics property for specific information regarding the error.
      
      | Error code                         | Description                                                                                                                 |
      | ---------------------------------- | --------------------------------------------------------------------------------------------------------------------------- |
      | CONFLICTING_VALUES                 | Two or more supplied values are contradictory.                                                               |
      | FILE_SIZE_ERROR                    | The file is either empty or too large.                                                                                      |
      | INAPPROPRIATE_VALUE                | A value, which is acceptable under different conditions, is inappropriate in the context of the other information provided. |
      | INVALID_VALUE                      | The input provided does not conform to the expected data types and format.                                                  |
      | MISSING_VALUE                      | A field defined as mandatory for an endpoint has not been provided.                                                         |
    headers:
      X-Correlation-ID:
        description: |
          The X-Correlation-ID from the request header, if supplied, mirrored back.
        required: false
        schema:
          type: 'string'
          example: '11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA'
      X-Request-ID:
        description: |
          The e-RS transaction id
        required: false
        schema:
          type: 'string'
          example: '58621d65-d5ad-4c3a-959f-0438e355990e-1'
      Content-Type:
        description: |
          Indicates the media type of the associated resource.
        required: true
        schema:
          type: 'string'
          enum:
            - 'application/fhir+json'
          example: 'application/fhir+json'
    content:
      'application/fhir+json':
        schema:
          title: 'eRS-OperationOutcome'
          type: 'object'
          required:
            - 'resourceType'
            - 'meta'
            - 'issue'
          properties:
            resourceType:
              type: 'string'
              enum:
                - 'OperationOutcome'
              example: 'OperationOutcome'
            meta:
              type: 'object'
              properties:
                profile:
                  type: 'array'
                  items:
                    type: 'string'
                    enum:
                      - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                    example: 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                  minItems: 1
                  maxItems: 1
            issue:
              type: 'array'
              items:
                type: 'object'
                required:
                  - 'severity'
                  - 'code'
                  - 'details'
                properties:
                  severity:
                    type: 'string'
                    example: 'error'
                  code:
                    type: 'string'
                    example: 'business-rule'
                  diagnostics:
                    type: 'string'
                    example: '''Shortlist/Service Id'' (11002) cannot be added to a shortlist more than once.'
                  details:
                    type: 'object'
                    required:
                      - 'coding'
                    properties:
                      coding:
                        type: 'array'
                        items:
                          type: 'object'
                          required:
                            - 'system'
                            - 'code'
                            - 'display'
                          properties:
                            system:
                              type: 'string'
                              enum:
                                - 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                              example: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                            code:
                              type: 'string'
                              example: 'DUPLICATE_SERVICE'
                            display:
                              type: 'string'
                              example: 'Duplicate service found in shortlist'
        example:
          meta:
            profile:
              - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
          resourceType: 'OperationOutcome'
          issue:
            -
              severity: 'error'
              code: 'value'
              details:
                coding:
                  -
                    system: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                    code: 'UNEXPECTED_FIELD'
                    display: 'Unexpected field'
              diagnostics: '''parameter[0]/resource/contained[0]/parameter[1]'' (unknownParameter) unknown parameter name'
  429:
    description: |
      The e-Referral service APIs limit the number of transactions you can make per unit of time.
      This protects our service against excessive use and denial-of-service (DoS) attacks, and is also to encourage you to use our APIs efficiently.
      
      Our standard rate limit for the production environment is 10 requests per second per application.
      If you go over the rate limit you'll receive a response with an HTTP status of 429 (Too Many Requests).
      
      Our path-to-live environments have very low rate limits.
      They are for functional testing only - you should not use them for [performance testing](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#performance-testing).
      
      If you have problems with rate limits, [contact us](https://digital.nhs.uk/developer/help-and-support) to discuss your application design and volumetrics,
      and to see whether it's appropriate to raise your rate limit.
      
      If a 429 response is received, indicating a request has been rate limited, then you must back off and retry with exponentially increasing periods between requests.
      Once a request is successful again, then you may continue to send requests inline with the documented rate limits.
      
      Example:
        - Receive a 429 response
        - Wait 1s and resend, but still receive a 429
        - Wait 2s and resend, but still receive a 429
        - Wait 4s, request is successful
        - Return to normal request cadence
  500:
    description: 'Internal Server Error'
  503:
    description: |
      Where status code 503 (Service Unavailable) is returned then an eRS-OperationOutcome-1 will be included in the body, as detailed below.
      In response to receiving this status code, it is recommended that clients retry at a later time based on a returned `Retry-After` header when provided.
      
      | Error code                         | Description                                                                                                                          |
      | ---------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------ |
      | SYSTEM_UNAVAILABLE                 | A request to an internal component timed out whilst attempting to serve a response or the system is currently otherwise unavailable. |
    headers:
      X-Correlation-ID:
        description: |
          The X-Correlation-ID from the request header, if supplied, mirrored back.
        required: false
        schema:
          type: 'string'
          example: '11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA'
      X-Request-ID:
        description: |
          The e-RS transaction id
        required: false
        schema:
          type: 'string'
          example: '58621d65-d5ad-4c3a-959f-0438e355990e-1'
      Content-Type:
        description: |
          Indicates the media type of the associated resource.
        required: true
        schema:
          type: 'string'
          enum:
            - 'application/fhir+json'
          example: 'application/fhir+json'
      Retry-After:
        description: |
          Defines a period (in seconds) after which the client should attempt their request again.
        required: false
        schema:
          type: 'string'
          example: '120'
    content:
      'application/fhir+json':
        schema:
          title: 'eRS-OperationOutcome'
          type: 'object'
          required:
            - 'resourceType'
            - 'meta'
            - 'issue'
          properties:
            resourceType:
              type: 'string'
              enum:
                - 'OperationOutcome'
              example: 'OperationOutcome'
            meta:
              type: 'object'
              properties:
                profile:
                  type: 'array'
                  items:
                    type: 'string'
                    enum:
                      - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                    example: 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
                  minItems: 1
                  maxItems: 1
            issue:
              type: 'array'
              items:
                type: 'object'
                required:
                  - 'severity'
                  - 'code'
                  - 'details'
                properties:
                  severity:
                    type: 'string'
                    example: 'error'
                  code:
                    type: 'string'
                    example: 'business-rule'
                  diagnostics:
                    type: 'string'
                    example: '''Shortlist/Service Id'' (11002) cannot be added to a shortlist more than once.'
                  details:
                    type: 'object'
                    required:
                      - 'coding'
                    properties:
                      coding:
                        type: 'array'
                        items:
                          type: 'object'
                          required:
                            - 'system'
                            - 'code'
                            - 'display'
                          properties:
                            system:
                              type: 'string'
                              enum:
                                - 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                              example: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                            code:
                              type: 'string'
                              example: 'DUPLICATE_SERVICE'
                            display:
                              type: 'string'
                              example: 'Duplicate service found in shortlist'
        example:
          meta:
            profile:
              - 'https://fhir.nhs.uk/STU3/StructureDefinition/eRS-OperationOutcome-1'
          resourceType: 'OperationOutcome'
          issue:
            -
              severity: 'error'
              code: 'transient'
              details:
                coding:
                  -
                    system: 'https://fhir.nhs.uk/STU3/CodeSystem/eRS-APIErrorCode-1'
                    code: 'SYSTEM_UNAVAILABLE'
                    display: 'System Unavailable'
